[project]
name = "ospsd-team-4"
version = "0.1.0"
requires-python = ">=3.11.5"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "issue-tracker-contract",
]

# The shared contract lives in contract/ and is installed from this repository.
[tool.uv.sources]
issue-tracker-contract = { workspace = true }

[tool.uv.workspace]
members = ["contract"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
# Treat both the service and the contract package as first-party code.
src = [".", "contract/src"]

[tool.ruff.lint]
# Use Ruff's default rules as a baseline for common coding mistakes.
# Ruff's version is locked in uv.lock; review rule changes when upgrading.
# Rule descriptions: https://docs.astral.sh/ruff/default-rules/