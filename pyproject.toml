[project]
name = "ospsd-team-4"
version = "0.1.0"
requires-python = ">=3.11.5"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "issue-tracker-contract==1.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
]

# The shared contract is installed from a tagged revision of this repository,
# not from the local contract/ folder. See README "Contract versioning".
[tool.uv.sources]
issue-tracker-contract = { git = "https://github.com/Tyler-Arciniaga/OSPSD-Team-4.git", tag = "issue-tracker-contract-v1.0.0", subdirectory = "contract" }

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
# Treat both the service and the contract package as first-party code.
src = [".", "contract/src"]

[tool.ruff.lint]
# Use Ruff's default rules as a baseline for common coding mistakes.
# Ruff's version is locked in uv.lock; review rule changes when upgrading.
# Rule descriptions: https://docs.astral.sh/ruff/default-rules/