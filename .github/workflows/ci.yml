# Based on uv's GitHub Actions guide:
# https://docs.astral.sh/uv/guides/integration/github/

name: CI

# Run when commits are pushed or pull requests are opened or updated.
on:
  push:
  pull_request:

# Allow the workflow to read the repository.
permissions:
  contents: read

# Run the steps below on a temporary Linux machine provided by GitHub.
jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # Download the repository's code into the runner.
      - name: Check out repository
        uses: actions/checkout@v7

      # Use the uv and Python versions verified locally.
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.17"
          python-version: "3.13.5"

      # Create the environment and install dependencies from uv.lock.
      # Fail if the lockfile needs updating.
      - name: Install dependencies
        run: uv sync --locked

      # Check for common coding mistakes and import organization.
      - name: Run lint checks
        run: uv run --locked ruff check .

      # Verify formatting without modifying files.
      - name: Check formatting
        run: uv run --locked ruff format --check .

      # Check type annotations against how values are used.
      - name: Run type checks
        run: uv run --locked mypy app tests contract/src contract/tests

      # Run the project's tests inside that environment.
      - name: Run tests
        run: uv run --locked pytest

  # The shared conformance suite against the controlled implementation: the
  # real service, started with uvicorn, backed by an in-memory provider
  # (tests/controlled/). No network access or provider credentials.
  conformance-controlled:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.17"
          python-version: "3.13.5"

      - name: Install dependencies
        run: uv sync --locked

      # The server keeps running in the background for the next step.
      - name: Start the service with the in-memory provider
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          nohup uv run --locked uvicorn tests.controlled.server:app \
            --host 127.0.0.1 --port 8000 > controlled-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /dev/null 2>&1; then
              curl -fsS http://127.0.0.1:8000/readyz
              echo
              exit 0
            fi
            sleep 1
          done
          echo "The controlled service did not answer /healthz within 30 seconds."
          cat controlled-server.log
          exit 1

      # Fails if any test fails, and also if any is skipped: a skipped suite
      # (for example, CONFORMANCE_BASE_URL not reaching pytest) proves nothing.
      - name: Run the conformance suite
        env:
          CONFORMANCE_BASE_URL: http://127.0.0.1:8000
        run: |
          uv run --locked pytest contract/tests/conformance -v -rs | tee conformance.log
          if grep -Eq '[0-9]+ skipped' conformance.log; then
            echo "Conformance tests were skipped; the suite must run in full."
            exit 1
          fi

      - name: Show the service log
        if: failure()
        run: cat controlled-server.log

  # Build the deployable image and check it in a throwaway container with
  # fake configuration (scripts/disposable_env.sh). Nothing is pushed or
  # deployed: deploys are manual (terraform-apply.yml).
  docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the image and check it in a disposable container
        run: scripts/disposable_env.sh
