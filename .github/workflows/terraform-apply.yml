# Apply reviewed infrastructure changes (infra/). It deploys no code:
# releases do that (release.yml).
#
# Manual only: it runs when someone starts it from the Actions tab (or
# `gh workflow run`), and then waits for approval on the render-infrastructure
# environment. No push, merge, schedule or other workflow ever triggers it.
#
# Steps: work out the image digest a newly created or converted service starts
# on, plan and apply the configuration on main, then plan again and fail
# unless it shows no changes, which proves a repeated apply with unchanged
# inputs changes nothing.

name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      disposable:
        description: "Keep (or create) the disposable demo service. Leave unticked to remove it."
        type: boolean
        default: false
      bootstrap_image_digest:
        description: "Only for the very first apply (docs/DEPLOYMENT.md, bootstrap): the sha256:... digest to start on. Otherwise leave empty: the latest successful production release is used."
        type: string
        required: false

permissions:
  contents: read

# Shares the release workflow's group (release.yml), so applies, destroys
# and releases never overlap, and none is cancelled halfway. A run started
# while another waits in this group replaces the waiting one; re-run it.
concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  apply:
    # Only reviewed, merged configuration is applied.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers on this environment approve the run before it starts.
    environment: render-infrastructure
    permissions:
      contents: read
      # Read the release record for the latest successful digest.
      deployments: read

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      TF_VAR_disposable_enabled: ${{ inputs.disposable }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.17"
          python-version: "3.13.5"

      # Ignored for services that already run an image; it only matters for a
      # service this apply creates or switches to the image runtime.
      - name: Choose the digest a new service starts on
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIVEN: ${{ inputs.bootstrap_image_digest }}
        run: |
          if [ -n "$GIVEN" ]; then
            digest="$GIVEN"
            echo "Using the digest given by hand: $digest"
          else
            uv sync --locked --no-dev
            if ! known="$(uv run --locked --no-dev python -m scripts.release known-good \
                --repo "$GITHUB_REPOSITORY" --environment render-production)"; then
              echo "::error::No successful production release is recorded yet. For the first apply, give bootstrap_image_digest (docs/DEPLOYMENT.md, bootstrap)."
              exit 1
            fi
            echo "$known"
            digest="$(sed -n 's/^digest=//p' <<<"$known")"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::'$digest' is not an image digest (sha256:<64 hex>)."
            exit 1
          fi
          echo "TF_VAR_bootstrap_image_digest=$digest" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.1"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Initialize
        run: terraform init -input=false

      # The plan file stays on this runner and is deleted with it. It is
      # never uploaded, because plan files can hold sensitive values.
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt
          {
            echo "## Plan applied by this run"
            echo
            echo "Disposable service: \`$TF_VAR_disposable_enabled\`. Digest for a newly created or converted service: \`$TF_VAR_bootstrap_image_digest\`."
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Applies exactly the plan shown above.
      - name: Apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      # The release workflow reads these from the GitHub environments.
      - name: Show the service IDs and URLs
        run: |
          {
            echo "## Services"
            echo
            echo "Set these as the \`RENDER_SERVICE_ID\` and \`SERVICE_URL\` variables of each GitHub environment."
            echo
            echo "| Environment | RENDER_SERVICE_ID | SERVICE_URL |"
            echo "| --- | --- | --- |"
            echo "| render-production | \`$(terraform output -raw service_id)\` | $(terraform output -raw service_url) |"
            if [ "$TF_VAR_disposable_enabled" = "true" ]; then
              echo "| render-disposable | \`$(terraform output -raw disposable_service_id)\` | $(terraform output -raw disposable_service_url) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Proof that applying again with unchanged inputs changes nothing:
      # exit code 0 means no changes, 2 means the next apply would change
      # something.
      - name: Plan again (must show no changes)
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode | tee replan.txt
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "## Second plan (idempotency check)"
            echo
            echo '```'
            cat replan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then
            echo "No changes: a repeated apply would do nothing."
          elif [ "$status" -eq 2 ]; then
            echo "The second plan still shows changes; a repeated apply would change something."
            exit 1
          else
            exit "$status"
          fi
