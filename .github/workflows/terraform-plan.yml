# Preview infrastructure changes before they are applied.
#
# On every pull request that touches infra/, this checks formatting, validates
# the configuration and runs `terraform plan` against the shared state, then
# posts the plan on the pull request for review. It never applies anything:
# applying is manual (terraform-apply.yml). The plan is kept only as text;
# no plan file is saved or uploaded, because plan files can hold sensitive
# values.

name: Terraform plan

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/terraform-destroy.yml"

permissions:
  contents: read
  pull-requests: write # to post the plan as a comment

# A newer push to the same pull request replaces a running plan.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      # Read by the Render provider. Secrets are not given to pull requests
      # from forks; those get format and validation checks only.
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      HAS_CREDENTIALS: ${{ secrets.TF_API_TOKEN != '' && secrets.RENDER_API_KEY != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The same Terraform version as infra/versions.tf. The token lets
      # Terraform read and lock the shared state in HCP Terraform.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.1"
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize
        run: |
          if [ "$HAS_CREDENTIALS" = "true" ]; then
            terraform init -input=false
          else
            echo "No HCP Terraform or Render credentials (pull request from a fork?):"
            echo "validating without the shared state and skipping the plan."
            terraform init -input=false -backend=false
          fi

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        if: env.HAS_CREDENTIALS == 'true'
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m > plan.txt 2>&1
          status=$?
          set -e
          cat plan.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Terraform plan"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated on each push.
      - name: Post the plan on the pull request
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v9.0.0
        env:
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            const limit = 60000;
            let plan = fs.readFileSync("infra/plan.txt", "utf8");
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + "\n... (truncated; see the workflow run for the full plan)";
            }
            const result = process.env.PLAN_STATUS === "0" ? "succeeded" : "FAILED";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan ${result} for \`${context.sha.slice(0, 7)}\``,
              "",
              "Review this before applying. Applying is manual: run the **Terraform apply and deploy** workflow from `main` after merging.",
              "",
              "<details open><summary>Plan</summary>",
              "",
              "```",
              plan,
              "```",
              "",
              "</details>",
              "",
              `[Workflow run](${run})`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'success' && steps.plan.outputs.status != '0'
        run: |
          echo "terraform plan failed; see the plan output above."
          exit 1
