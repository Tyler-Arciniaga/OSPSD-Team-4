# Preview infrastructure changes before they are applied.
#
# On every pull request this checks formatting and validates the
# configuration. When the pull request touches infra/ or the Terraform
# workflows, it also runs `terraform plan` against the shared state and posts
# the plan on the pull request for review. Pull requests that touch neither
# skip the plan, and never receive the HCP token or the Render API key, so the
# check reports on every pull request without blocking unrelated ones. It
# never applies anything:
# applying is manual (terraform-apply.yml). The plan is kept only as text;
# no plan file is saved or uploaded, because plan files can hold sensitive
# values.

name: Terraform plan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the plan as a comment

# A newer push to the same pull request replaces a running plan.
concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      # Secrets are not given to pull requests from forks; those get format
      # and validation checks only.
      HAS_CREDENTIALS: ${{ secrets.TF_API_TOKEN != '' && secrets.RENDER_API_KEY != '' }}

    steps:
      # Full history, so the pull request can be compared with its base.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Compared from the merge base, so changes merged into the base branch
      # since the pull request started do not count as its own.
      - name: Check whether the pull request changes infrastructure
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -E '^(infra/|\.github/workflows/terraform-)' || true)"
          if [ -n "$changed" ]; then
            echo "Infrastructure files changed:"
            echo "$changed"
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "No infrastructure changes: formatting and validation only, no plan."
            echo "infra=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Terraform plan"
              echo
              echo "Skipped: this pull request does not change \`infra/\` or the Terraform workflows."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The same Terraform version as infra/versions.tf. The token lets
      # Terraform read and lock the shared state in HCP Terraform; it is
      # given only when a plan will run.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.17.1"
          cli_config_credentials_token: ${{ steps.changes.outputs.infra == 'true' && secrets.TF_API_TOKEN || '' }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize
        env:
          INFRA_CHANGED: ${{ steps.changes.outputs.infra }}
        run: |
          if [ "$INFRA_CHANGED" != "true" ]; then
            terraform init -input=false -backend=false
          elif [ "$HAS_CREDENTIALS" = "true" ]; then
            terraform init -input=false
          else
            echo "No HCP Terraform or Render credentials (pull request from a fork?):"
            echo "validating without the shared state and skipping the plan."
            terraform init -input=false -backend=false
          fi

      - name: Validate
        run: terraform validate -no-color

      # infra/tests: how images are pinned, against a mock Render provider.
      # No credentials or network beyond downloading the provider.
      - name: Test
        run: terraform test -no-color

      - name: Plan
        id: plan
        if: env.HAS_CREDENTIALS == 'true' && steps.changes.outputs.infra == 'true'
        env:
          # Read by the Render provider, only in this step.
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m > plan.txt 2>&1
          status=$?
          set -e
          cat plan.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo "## Terraform plan"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, updated on each push.
      - name: Post the plan on the pull request
        if: steps.plan.outcome == 'success'
        uses: actions/github-script@v9.0.0
        env:
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            const limit = 60000;
            let plan = fs.readFileSync("infra/plan.txt", "utf8");
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + "\n... (truncated; see the workflow run for the full plan)";
            }
            const result = process.env.PLAN_STATUS === "0" ? "succeeded" : "FAILED";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan ${result} for \`${context.sha.slice(0, 7)}\``,
              "",
              "Review this before applying. Applying is manual: run the **Terraform apply** workflow from `main` after merging.",
              "",
              "<details open><summary>Plan</summary>",
              "",
              "```",
              plan,
              "```",
              "",
              "</details>",
              "",
              `[Workflow run](${run})`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if the plan failed
        if: steps.plan.outcome == 'success' && steps.plan.outputs.status != '0'
        run: |
          echo "terraform plan failed; see the plan output above."
          exit 1
