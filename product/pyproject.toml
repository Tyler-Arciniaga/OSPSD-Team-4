[project]
name = "ospsd-team4-product"
version = "0.1.0"
description = "Team 4's HW3 product service: plans focus blocks from tracker issues, books them in a calendar and writes a standup doc to cloud storage."
readme = "README.md"
# team5-calendar requires Python 3.14.
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pydantic>=2.14",
    # The service runs in a slim image with no system time zone database.
    "tzdata>=2025.2",
    # Every contract is a direct dependency, pinned to an immutable tag.
    # All three are PEP 508 URLs rather than [tool.uv.sources] entries: an
    # implementation declares the same URL, and uv treats a `tag =` source
    # and an `@tag` URL as conflicting requirements
    # (docs/evidence/partner-installs.md, note 1; for cloud-storage-api,
    # Team 1's package: docs/evidence/storage-swap.md).
    "cloud-storage-api @ git+https://github.com/Dayana20/ospsd26-cloud-storage.git@0.3.1#subdirectory=src/cloud_storage_api",
    # Implementations, selected at runtime by TRACKER_PROVIDER,
    # CALENDAR_PROVIDER and STORAGE_PROVIDER.
    "team-4-issue-tracker-trello",
    "team5-calendar",
    "dropbox-client-impl",
    # Team 1's Dropbox storage, the swap-in alternative to Team 3's
    # (STORAGE_PROVIDER=team1_dropbox:Team1DropboxStorage.from_env).
    "team1-dropbox-storage",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

# Every package is pinned to an immutable release tag. Never pin a branch.
[tool.uv.sources]
team-4-issue-tracker-trello = { git = "https://github.com/Tyler-Arciniaga/OSPSD-Team-4.git", tag = "team-4-issue-tracker-trello-v1.0.0", subdirectory = "team-4-trello-impl" }
team5-calendar = { git = "https://github.com/juno-junhyuk-lee/OSPSD-Team-5.git", tag = "team5-calendar-v0.1.0", subdirectory = "packages/team5-calendar" }
# Team 1 has not tagged its package yet: pinned to the reviewed commit on its
# hw3-dropbox-package branch. Switch to a tag as soon as one exists.
team1-dropbox-storage = { git = "https://github.com/Dayana20/sandbox.git", rev = "784be97fc111338c6746b9d7288bf84a333a9b16", subdirectory = "packages/team1_dropbox" }
dropbox-client-impl = { git = "https://github.com/Shreyas191/OSPSD-Team-3.git", tag = "v0.3.0", subdirectory = "src/dropbox_client_impl" }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests name helpers in tests/ as provider import paths.
pythonpath = ["."]

[tool.ruff]
# Ruff's default rules, as in the HW2 service.
src = ["src", "tests"]
# The TUI is its own uv project with its own checks (tui/README.md).
extend-exclude = ["tui"]

[tool.mypy]
strict = true

[tool.pyright]
# Editors (pyright/basedpyright) resolve imports from the product venv, not the
# repository root venv, which lacks the calendar and storage packages.
venvPath = "."
venv = ".venv"
